<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ada yang mau aku omongin...</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.95);
      padding: 35px 25px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(233, 30, 99, 0.2);
      text-align: center;
      max-width: 420px;
      width: 100%;
    }
    .emoji-main { font-size: 60px; margin-bottom: 15px; }
    h1 { color: #d81b60; font-size: 22px; margin-bottom: 12px; }
    p { color: #555; font-size: 15px; line-height: 1.6; margin-bottom: 25px; }
    .btn-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      position: relative;
      min-height: 50px;
    }
    button {
      padding: 12px 28px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 25px;
      cursor: pointer;
    }
    #btnMau { background: #e91e63; color: white; }
    #btnGak { background-color: #888; color: white; position: absolute; }
  </style>
</head>
<body>

  <div class="card">
    <div class="emoji-main" id="emoji">💌</div>
    <h1 id="pertanyaan">Hai, aku mau jujur sesuatu...</h1>
    <p id="pesan">Selama ini aku ngerasa nyaman banget kalau sama kamu. Kamu mau gak jalanin hubungan yang lebih serius sama aku?</p>
    
    <div class="btn-container" id="btnGroup">
      <button id="btnMau" onclick="terima()">Mau Bgt! ❤️</button>
      <button id="btnGak" onmouseover="kabur()" onclick="kabur()">Gak</button>
    </div>
  </div>

  <script>
    // Token & ID dari screenshot kamu
    const TELEGRAM_TOKEN = '8901287115:AAG4KALiqyj-ACdt1rLIegW-NJU98TE2HZI';
    const TELEGRAM_CHAT_ID = '7578342046';

    function kirimNotifikasi(jawaban) {
      const pesan = `🚨 *PEMBERITAHUAN JAWABAN!*\n\nDia baru saja klik tombol: *${jawaban}*! ❤️🎉`;
      const url = `https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`;

      fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: TELEGRAM_CHAT_ID,
          text: pesan,
          parse_mode: 'Markdown'
        })
      });
    }

    function kabur() {
      const btnGak = document.getElementById('btnGak');
      const x = Math.floor(Math.random() * 200) - 100;
      const y = Math.floor(Math.random() * 160) - 80;
      btnGak.style.transform = `translate(${x}px, ${y}px)`;
    }

    function terima() {
      document.getElementById('emoji').innerText = "🥰💖";
      document.getElementById('pertanyaan').innerText = "Yeay! Makasih yaa!";
      document.getElementById('pesan').innerHTML = "Makasih udah mau terima aku. <br>Mulai hari ini, cerita kita dimulai! ✨";
      document.getElementById('btnGroup').style.display = 'none';

      // Mengirimkan notifikasi
      kirimNotifikasi('MAU / DITERIMA!');
    }
  </script>
</body>
</html>
